# Resume data, rendered by template.typ.
#
# Sections render in the order listed. Any section, entry, bullet, or list
# item can be left out of the PDF by adding `hide: true` to it (plain-string
# bullets need the `{ text: ..., hide: true }` form).
#
# Tailoring: give any of those a `topics` list (e.g. `topics: [robotics]`) and
# it only appears in versions from versions.yaml that select one of its topics.
# Anything without topics appears in every version.
#
# Entry fields (all optional except title):
#   title          bold, left of the first line
#   title-note     italic, right after the title
#   right          bold, right side of the first line (dates, tech stack)
#   right-italic   italic instead of bold, right side of the first line
#   subtitle       italic, left of the second line
#   subtitle-right italic, right side of the second line
#   subtitle-bold  bold instead of italic, right side of the second line
#   details        extra lines on their own, as `{ label, text }`
#   bullets        strings, or `{ label, text }` for a bold lead-in, or
#                  `{ label, items }` for a comma-separated list where each
#                  item is a string or `{ text, topics }`
# An entry can have `roles` (a list of `{ subtitle, subtitle-right, subtitle-bold }`)
# instead of a single subtitle, e.g. several degrees at one school.

