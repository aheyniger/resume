# Resume data, rendered by layout.typ. Unknown field names stop the build
# (see checks.typ), so the field list below is the complete set.
#
# Sections render in the order listed. Any section, entry, bullet, or list
# item can be left out of the PDF by adding `hide: true` to it (plain-string
# bullets need the `{ text: ..., hide: true }` form).
#
# Tailoring: give any of those a `topics` list (e.g. `topics: [robotics]`) and
# it only appears in versions from versions.yaml that select one of its topics.
# Anything without topics appears in every version.
#
# Give any of them an `id` (a short name you make up, used once) so a version
# can leave it out with `exclude: [that-id]`.
#
# Anything with `text` can also have `variants`, other wordings by topic:
#   text: Default wording
#   variants:
#     robotics: Wording for versions that select robotics
#     webdev: Wording for versions that select webdev
# A version uses the first variant (in the order written) whose topic it
# selects, otherwise `text`. Versions with `topics: all` always use `text`.
#
# Entry fields (all optional). They say what something is; layout.typ
# decides how it looks:
#   name      organization, school, or project name
#   note      short aside after the name, e.g. "(Graduate course project)"
#   location  city and state
#   role      job title, degree, or project role
#   dates     when, as free text, e.g. "June 2025 – Feb. 2026"
#   roles     several `{ role, dates }` instead of one role + dates, e.g.
#             degrees at one school, or a promotion
#   stack     technologies used: a list of strings or `{ text, topics }`
#   bullets   strings, or `{ label, text }` for a bold lead-in, or
#             `{ label, items }` for a comma-separated list where each
#             item is a string or `{ text, topics }`
#
# Private details: an item can be just `private: <key>` (plus `hide`,
# `topics`, `id`), and its fields come from private.yaml under that key. It
# only appears in `./scripts/build.sh --private` builds, so it never reaches
# GitHub.
#
# Formatting in any text: *asterisks* make bold (write \* for a literal
# asterisk), and straight quotes and apostrophes are curled automatically.
# Quote a value that starts with *, since YAML reads a leading * as an alias:
#   - "*GPA: 3.68/4.0*; Dean’s List"

