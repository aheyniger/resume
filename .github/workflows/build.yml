name: Build resume

on:
  push:
    branches: [main]
    tags: ["**"] # `*` would not match the `/` in <version>/<label> tags
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases
    outputs:
      text-check: ${{ steps.check.outcome }} # success or failure
    steps:
      - uses: actions/checkout@v4

      # The Typst version comes from .typst-version, the same file build.sh
      # checks locally, so CI and local builds always use the same release.
      - name: Read Typst version
        id: typst-version
        run: echo "version=$(tr -d '[:space:]' < .typst-version)" >> "$GITHUB_OUTPUT"

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      # Fonts come from fonts/ in the repo, so nothing needs installing.
      # Tags are named <version>/<label> (e.g. amazon/2026-10-sde-intern) and
      # build only that version, whatever its `build`/`publish` flags say.
      # Everything else builds every version without `build: false`, which
      # also checks they all compile; the next step picks which to publish.
      - name: Build PDFs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != */* ]]; then
              echo "error: tag '$GITHUB_REF_NAME' should look like <version>/<label>, e.g. amazon/2026-10-sde-intern"
              exit 1
            fi
            bash build.sh "${GITHUB_REF_NAME%%/*}"
          else
            bash build.sh
          fi

      # Checks every built PDF reads in order as plain text, the way resume
      # screeners see it (see check-text.sh). What it flags goes on the run's
      # summary page. On main and tags a failure doesn't stop the run: the
      # approve job below waits for someone to look and approve it, and
      # nothing is published until then. Other runs (PRs) just fail.
      - name: Check PDF text
        id: check
        continue-on-error: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          if ! command -v pdftotext > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fi
          set -o pipefail
          if bash check-text.sh out/*.pdf | tee check-text.log; then exit 0; fi
          {
            echo "## PDF text check failed"
            echo
            echo "On main or a tag, the run waits for approval before publishing."
            echo
            echo '```'
            cat check-text.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=PDF text check failed::See the run summary for details"
          exit 1

      # Only versions without `publish: false` leave the build machine: run
      # artifacts on a public repo can be downloaded by anyone signed in to
      # GitHub, so they come from site/ too, not out/. make-site.sh also
      # writes the index page from site-template.html.
      - name: Collect published PDFs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bash make-site.sh

      # Downloadable from the run's summary page for 90 days. Tag runs skip
      # this; their release has the PDF.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: resume-pdfs
          path: site/*.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      # Pushing a tag saves a permanent release holding that one version as it
      # was at the tagged commit (see release.sh). If the text check failed,
      # the approve job makes the release instead, once approved.
      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/') && steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash release.sh out/*.pdf

  # Runs only when the text check failed on main or a tag, and waits for a
  # reviewer of the text-check-override environment (set up in the repo's
  # Settings > Environments) to approve it from the run's page. Approving
  # publishes anyway: on main it lets deploy-pages go ahead with the files
  # already uploaded, and on a tag it rebuilds that version here and makes
  # the release, so nothing of a rejected tag run leaves the build machine.
  # Rejecting it, or leaving it for 30 days, fails the run.
  approve:
    needs: build
    if: needs.build.outputs.text-check == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases
    environment: text-check-override
    steps:
      - name: Note the approval
        run: echo "Publishing despite the failed PDF text check; see the build job's summary for what it flagged."

      - uses: actions/checkout@v4
        if: startsWith(github.ref, 'refs/tags/')

      - name: Read Typst version
        if: startsWith(github.ref, 'refs/tags/')
        id: typst-version
        run: echo "version=$(tr -d '[:space:]' < .typst-version)" >> "$GITHUB_OUTPUT"

      - uses: typst-community/setup-typst@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Build PDF and create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash build.sh "${GITHUB_REF_NAME%%/*}"
          bash release.sh out/*.pdf

  # Publishes the PDFs from main to https://<user>.github.io/<repo>/, once
  # the text check passed or a failure was approved. `!cancelled()` lets it
  # run when the approve job was skipped because the check passed.
  deploy-pages:
    needs: [build, approve]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success'
      && (needs.build.outputs.text-check == 'success' || needs.approve.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
