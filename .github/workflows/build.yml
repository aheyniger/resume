name: Build resume

on:
  push:
    branches: [main]
    tags: ["**"] # `*` would not match the `/` in <version>/<label> tags
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases
    steps:
      - uses: actions/checkout@v4

      # The Typst version comes from .typst-version, the same file build.sh
      # checks locally, so CI and local builds always use the same release.
      - name: Read Typst version
        id: typst-version
        run: echo "version=$(tr -d '[:space:]' < .typst-version)" >> "$GITHUB_OUTPUT"

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      # Fonts come from fonts/ in the repo, so nothing needs installing.
      # Tags are named <version>/<label> (e.g. amazon/2026-10-sde-intern) and
      # build only that version, whatever its `build`/`publish` flags say.
      # Everything else builds every version without `build: false`, which
      # also checks they all compile; the next step picks which to publish.
      - name: Build PDFs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF_NAME" != */* ]]; then
              echo "error: tag '$GITHUB_REF_NAME' should look like <version>/<label>, e.g. amazon/2026-10-sde-intern"
              exit 1
            fi
            bash build.sh "${GITHUB_REF_NAME%%/*}"
          else
            bash build.sh
          fi

      # Checks every built PDF reads in order as plain text, the way resume
      # screeners see it (see check-text.sh).
      - name: Check PDF text
        run: |
          if ! command -v pdftotext > /dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          fi
          bash check-text.sh out/*.pdf

      # Only versions without `publish: false` leave the build machine: run
      # artifacts on a public repo can be downloaded by anyone signed in to
      # GitHub, so they come from site/ too, not out/. make-site.sh also
      # writes the index page from site-template.html.
      - name: Collect published PDFs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: bash make-site.sh

      # Downloadable from the run's summary page for 90 days. Tag runs skip
      # this; their release has the PDF.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: resume-pdfs
          path: site/*.pdf

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      # Pushing a tag saves a permanent release holding that one version as it
      # was at the tagged commit, under the plain filename a recruiter sees.
      # The tag's message, if it has one, becomes the release notes. Pushing
      # a tag name again (after deleting and recreating the tag) replaces its
      # release instead of failing.
      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          filename=$(typst eval 'yaml("versions.yaml").filename' --format yaml)
          mkdir -p out/release
          cp out/*.pdf "out/release/$filename.pdf"

          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then # annotated tag
            notes=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          fi
          # No --cleanup-tag: the tag that triggered this run must stay.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "out/release/$filename.pdf" \
            --title "$GITHUB_REF_NAME" \
            --notes "${notes:-Resume as of tag $GITHUB_REF_NAME.}"

  # Publishes the PDFs from main to https://<user>.github.io/<repo>/
  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
