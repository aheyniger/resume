name: Build resume

on:
  push:
    branches: [main]
    tags: ["*", "!latest"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      # Fonts come from fonts/ in the repo, so nothing needs installing.
      - name: Build PDFs
        run: bash build.sh

      # Downloadable from the run's summary page for 90 days.
      - uses: actions/upload-artifact@v4
        with:
          name: resume-pdfs
          path: out/*.pdf

      # Pushes to main replace the "latest" release, giving stable links like
      # https://github.com/<user>/<repo>/releases/latest/download/aheyniger_resume.pdf
      - name: Update "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.pdf \
            --title "Latest resume" \
            --notes "Built from ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA" \
            --latest

      # Pushing a git tag (e.g. `git tag sent/spacex-2026-10`) saves a
      # permanent release with the PDFs exactly as they were at that commit.
      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.pdf \
            --title "$GITHUB_REF_NAME" \
            --notes "Resume as of tag $GITHUB_REF_NAME." \
            --latest=false
