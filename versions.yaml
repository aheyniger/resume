# Tailored versions of the resume, built by build.sh and GitHub Actions.
#
# The default version builds to <filename>.pdf; every other version builds
# to <filename>_<version>.pdf.
#
# Per version:
#   topics    which items to include by topic: `all`, or a list of topics.
#             Items with no `topics` in content.yaml are always included.
#   sections  optional: section titles in the order to show them (others
#             are dropped). Leave it out to use the order in content.yaml.
#   build     optional: set to false to skip this version when building
#             everything (CI included). `./build.sh <version>` still builds it.

filename: aheyniger_resume
default: full

versions:
  full:
    topics: all

  robotics:
    topics: [robotics, systems]

  webdev:
    topics: [webdev]

  gamedev:
    topics: [gamedev]
