# Tailored versions of the resume, built by build.sh and GitHub Actions.
#
# The default version builds to <filename>.pdf; every other version builds
# to <filename>_<version>.pdf.
#
# Per version:
#   topics    which items to include by topic: `all`, or a list of topics.
#             Items with no `topics` in content.yaml are always included.
#             Also picks which `variants` wording an item uses.
#   exclude   optional: ids of items in content.yaml to leave out, e.g.
#             [interests]. Wins over everything else, even `topics: all`.
#   sections  optional: section titles in the order to show them (others
#             are dropped). Leave it out to use the order in content.yaml.
#   max-pages optional: the most pages this version may take. Going over
#             fails the build; `./build.sh --watch` and the VS Code preview
#             instead mark the extra pages in red so you can see what to cut.
#   publish   optional: set to false to keep this version off GitHub Pages.
#             It's still built and checked locally and in CI.
#   build     optional: set to false to set this version aside: it isn't
#             built by `./build.sh` or checked in CI, and isn't published.
#             `./build.sh --all` and `./build.sh <version>` still build it.
#
#                      ./build.sh   CI checks   Pages
#   (neither)              yes         yes       yes
#   publish: false         yes         yes       no
#   build: false           no          no        no
#
# A tag release (see README) builds the version it names, whatever these say.

filename: Anders_Heyniger_Resume
default: full

versions:
  full:
    topics: all

  robotics:
    topics: [robotics, systems]

  webdev:
    topics: [webdev]

  gamedev:
    topics: [gamedev]
    publish: false
